[package]
name = "snipping-ocr-tool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
rfd = "0.15.4"
tempfile = "3"
opencc-fmmseg = "0.13.0"
rapidocr-core = { version = "0.2.2", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.6.1", default-features = false }
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
raw-window-handle = "0.6"
